alpaca:
  data_feed: iex
  paper_trading: true
bar_buffer_size: 500
dashboard:
  max_log_lines: 50
  refresh_rate: 1
  signal_history_count: 20
indicators:
  atr_period: 14
  bb_period: 20
  bb_std: 2
  ema_fast: 9
  ema_slow: 21
  macd_fast: 12
  macd_signal: 9
  macd_slow: 26
  rsi_period: 14
  sma_200: 200
  stoch_d: 3
  stoch_k: 14
ml:
  confidence_threshold: 0.40   # 0,65 era inalcanzable para el RF de 3 clases → ML no contaba; a 0,40 confirma/veta
  feature_lookback: 20
  min_bars_required: 50
  model_path: models/
  model_type: random_forest
risk:
  max_consecutive_losses: 5
  max_daily_loss_pct: 0.05
  max_orders_per_minute: 3
  max_position_pct: 0.05
  max_total_exposure: 0.8
  min_daily_volume: 500000
  min_stock_price: 5
  stop_loss_atr_multiplier: 2
  take_profit_atr_multiplier: 4
  min_stop_pct: 0.025          # suelo del stop (antes 1% fijo, demasiado fino)
  trailing_stop_pct: 3.0       # trailing stop del protector (asegura ganancias)
  trailing_stop_open_pct: 5.0  # trailing holgado en la apertura/overnight: aguanta el ruido de la campana
  trailing_open_window_min: 30 # minutos tras la apertura con el trailing holgado
  trend_timeframe: "1Day"
  trend_sma_period: 50
  trend_buffer_pct: 0.01       # banda neutra ±1% del SMA: no operar tendencia plana (anti-whipsaw)
  max_adx: 40                  # no entrar con ADX>40: tendencia demasiado fuerte (cazar cuchillos = 100% perdía)
  min_confidence: 0.55         # subido de 0.5 (29-jun): filtra entradas marginales (vol muy bajo / ADX alto) que rozaban el umbral
  symbol_cooldown_losses: 2    # pérdidas seguidas en un símbolo que activan su cooldown (0=off)
  symbol_cooldown_days: 5      # días sin operar ese símbolo (y ventana para contar la racha)
symbols:
- AAPL
- NVDA
- MSFT
- GOOGL
- AMZN
- SPY
- QQQ
- GLD
timeframe: 1Min
training:
  buy_threshold: 0.005
  forward_return_periods: 5
  lookback_days: 365
  max_depth: 10
  n_estimators: 200
  random_state: 42
  sell_threshold: -0.005
  test_split: 0.2
pushover:
  enabled: true
  min_signal_confidence: 1.0   # desactivadas: solo fills y rechazos importantes
  # Cuenta compartida: enviar solo a los dispositivos de Alfonso (no al iPhone de Diego)
  device: "Iphone_Alfonso,ipadpro129inch3gwi-fi"
llm_review:
  enabled: true              # poner true tras añadir ANTHROPIC_API_KEY al .env
  model: claude-opus-4-8
  fail_open: true             # si Claude falla/tarda, la operación sigue como hoy
  timeout: 60.0               # Opus 4.8 + web_search ~40s; margen para varianza (Sonnet 4.6 sería ~2x más rápido)
  news_lookback_hours: 24
  max_headlines: 10
  use_web_search: true        # Claude busca earnings/macro (FOMC/CPI) él mismo
  web_search_max_uses: 2
earnings_guard:
  enabled: true               # vigila posiciones ABIERTAS con earnings inminentes
  days_ahead: 2               # ventana en días de mercado
  action: close               # close = cerrar la posición | notify = solo avisar por Pushover